<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="45%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer Badge Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgGrad)" stroke="#ffedd5" stroke-width="5" filter="url(#shadow)"/>
  
  <!-- Dashed decorative ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#fed7aa" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Steamer / Bowl Icon Graphic -->
  <g transform="translate(100, 78) scale(0.9)">
    <!-- Steam lines -->
    <path d="M-22,-28 C-25,-36 -19,-44 -22,-52" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M0,-30 C-3,-38 3,-46 0,-55" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M22,-28 C19,-36 25,-44 22,-52" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- Steamer Bamboo Lid & Bowl -->
    <path d="M-45,-12 Q0,-24 45,-12 Q42,12 0,16 Q-42,12 -45,-12 Z" fill="#78350f" opacity="0.95"/>
    <path d="M-42,-10 Q0,-20 42,-10" fill="none" stroke="#fef08a" stroke-width="2"/>
    <path d="M-44, -5 C-42,18 -30,30 0,32 C30,30 42,18 44,-5 Z" fill="#9a3412"/>
    <path d="M-36, 4 C-25,22 25,22 36,4" fill="none" stroke="#f97316" stroke-width="3" opacity="0.6"/>

    <!-- Fresh Green Leaf garnish -->
    <path d="M12,-16 C25,-28 38,-20 34,-10 C30,-2 18,-6 12,-16 Z" fill="url(#leafGrad)"/>
    <path d="M14,-14 C22,-20 28,-14 26,-8" fill="none" stroke="#15803d" stroke-width="1.2"/>
  </g>

  <!-- Brand Typography -->
  <!-- Main "Kukusyuk" text with text shadow effect -->
  <text x="100" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="25" fill="#431407" letter-spacing="0.5">Kukusyuk</text>
  <text x="100" y="131" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="25" fill="#ffffff" letter-spacing="0.5">Kukusyuk</text>

  <!-- Subtitle Tag -->
  <rect x="52" y="141" width="96" height="18" rx="9" fill="#14532d"/>
  <text x="100" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="9.5" fill="#86efac" letter-spacing="1.5">CAMPUSFIT</text>
  
  <!-- Tiny Healthy Food stars -->
  <circle cx="44" cy="150" r="2" fill="#fef08a"/>
  <circle cx="156" cy="150" r="2" fill="#fef08a"/>
</svg>
